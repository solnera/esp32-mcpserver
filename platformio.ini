; PlatformIO configuration for native testing.
; Library consumers should reference library.json instead.

[platformio]
src_dir = src
include_dir = include

[common]
native_build_flags =
    -std=gnu++17
    -I test/mock
    -DARDUINOJSON_ENABLE_ARDUINO_STRING=1
    -DARDUINOJSON_ENABLE_ARDUINO_STREAM=0
    -DARDUINOJSON_ENABLE_ARDUINO_PRINT=0
    -DARDUINOJSON_ENABLE_PROGMEM=0
    -DMCP_HTTP_TEST_HOOKS=1

[env:native]
platform = native
test_framework = unity
build_flags =
    ${common.native_build_flags}
    ; Keep the default/compatibility side explicit so a numeric 0 is tested,
    ; not only the case where the option is absent.
    -DMCP_OMIT_TEXT_WHEN_STRUCTURED=0
test_build_src = yes
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
; Static analysis scope: our sources only — cppcheck cannot expand ArduinoJson's
; preprocessor magic and reports false "high" errors inside .pio/libdeps.
check_skip_packages = yes
check_src_filters =
    +<src/>
    +<include/>
check_flags =
; unusedFunction is meaningless for a library (exported APIs have no callers
; here); the ArduinoJson suppression is a cppcheck/simplecpp limitation — it
; cannot expand ArduinoJson's namespace macros and reports a false "high"
; while preprocessing OUR files that include it.
    cppcheck: --suppress=unusedFunction --suppress=preprocessorErrorDirective:*ArduinoJson*

; Builds the enabled side of MCP_OMIT_TEXT_WHEN_STRUCTURED, so the opt-out is
; compiled and asserted rather than merely declared. Only the protocol suite is
; affected by the flag, so that is all this env runs.
[env:native-omit-text]
platform = native
test_framework = unity
build_flags =
    ${common.native_build_flags}
    -DMCP_OMIT_TEXT_WHEN_STRUCTURED=1
test_build_src = yes
test_filter = test_mcp_server
lib_deps =
    bblanchon/ArduinoJson@^7.0.0

; Same suite instrumented for line coverage. Report with scripts/coverage.sh,
; which runs this env and then folds the per-object .gcda into a per-file
; summary over src/ and include/ only (the mocks and ArduinoJson are not ours
; to cover). Kept separate from env:native so the normal suite stays fast and
; free of instrumentation artifacts.
[env:native-cov]
platform = native
test_framework = unity
build_flags =
    ${env:native.build_flags}
    --coverage
    -O0
    -g
build_type = debug
extra_scripts = pre:scripts/pio_coverage.py
test_build_src = yes
lib_deps =
    bblanchon/ArduinoJson@^7.0.0

; Same suite under AddressSanitizer + UBSan. Run with
; ASAN_OPTIONS=alloc_dealloc_mismatch=1 so a new/delete object placed in
; _tempObject (which ESPAsyncWebServer releases with free()) is caught.
[env:native-san]
platform = native
test_framework = unity
build_flags =
    ${env:native.build_flags}
    -fsanitize=address,undefined
    -fno-omit-frame-pointer
    -g
test_build_src = yes
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
